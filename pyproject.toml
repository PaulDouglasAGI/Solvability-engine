[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvability-engine"
version = "0.1.0"
description = "Looks back at reported property-theft cases and estimates P(case cleared) over time from public data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "statsmodels>=0.14"]

[project.scripts]
solvability = "solvability.cli:main"

[tool.setuptools.packages.find]
include = ["solvability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
